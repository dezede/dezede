# Added by Norisk. Starts only by hand, from the application or at night (workflow_dispatch): never from a pull request.
name: Deploy
on:
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The secrets below live in this environment, restricted to the default branch: a branch cannot read them.
    environment: production
    env:
      DEPLOY_BRANCH: "master"
      DEPLOY_TRANSPORT: "openssh"
      NORISK_DEPLOY_TOKEN: ${{ secrets.NORISK_DEPLOY_TOKEN }}
      NORISK_SSH: ${{ secrets.NORISK_SSH }}
      NORISK_DEPLOY_SETTINGS: ${{ secrets.NORISK_DEPLOY_SETTINGS }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .norisk/run.sh
