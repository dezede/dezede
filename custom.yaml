services:
  postgresql:
    build:
      context: ..
      dockerfile: postgresql.Dockerfile
    image: $PROJECT/postgresql:${IMAGES_TAG:-latest}
    environment:
      # FIXME: Remove when upgrading to a more recent PostgreSQL version.
      POSTGRES_INITDB_ARGS:
    shm_size: 512mb
    deploy:
      resources:
        limits:
          memory: 3000M
  redis:
    image: $PROJECT/redis:${IMAGES_TAG:-latest}
    build:
      context: ..
      dockerfile: redis.Dockerfile
    volumes:
      - redis-data:/data
      - redis-socket:/var/run/redis
    network_mode: none
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 1s
      retries: 60
  migrate:
    command: sh -c "python manage.py collectstatic --ignore bootstrap/docs/* --no-input && python manage.py migrate"
    volumes:
      - redis-socket:/var/run/redis
      - static:/srv/static
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2000M
  rq:
    image: $PROJECT/django:${IMAGES_TAG:-latest}
    command: python manage.py rqworker
    environment:
      PROJECT: $PROJECT
      PROJECT_VERBOSE: $PROJECT_VERBOSE
      DOMAIN: $DOMAIN
      TZ: $TZ
      LOCALE: $LOCALE
      LANGUAGES_CODES: $LANGUAGES_CODES
      EMAIL_ADDRESS: $EMAIL_ADDRESS
    volumes:
      - postgresql-socket:/var/run/postgresql
      - redis-socket:/var/run/redis
      - media:/srv/media
      - static:/srv/static
    secrets:
      - .env.secrets
    networks:
      internal:
    tmpfs:
      - /tmp/
    restart: "always"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  django:
    build:
      context: ..
      dockerfile: docker-compose-django/Dockerfile
    volumes:
      - static:/srv/static
      - redis-socket:/var/run/redis
    depends_on:
      redis:
        condition: service_healthy
      rq:
        condition: service_started
    healthcheck:
      interval: 240s
      timeout: 240s
    deploy:
      resources:
        limits:
          memory: 3000M
  react:
    build:
      context: ../frontend
      dockerfile: ../docker-compose-django/react/Dockerfile
    depends_on:
      django:
        condition: service_healthy
  nginx:
    build:
      context: ..
      dockerfile: docker-compose-django/nginx.Dockerfile
    environment:
      CSP_DEFAULT: "'self' https://analyseweb.huma-num.fr"
      CSP_SCRIPT: "'self' 'unsafe-inline' 'unsafe-eval' code.jquery.com https://analyseweb.huma-num.fr https://cdn.jsdelivr.net https://cdnjs.cloudflare.com"
      CSP_IMG: "'self' data: blob: https://cdnjs.cloudflare.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org http://www.gravatar.com https://code.jquery.com https://analyseweb.huma-num.fr https://i.ytimg.com"
      CSP_STYLE: "'self' 'unsafe-inline' code.jquery.com cdn.jsdelivr.net https://cdnjs.cloudflare.com"
      CSP_CONNECT: "'self' https://analyseweb.huma-num.fr cdn.jsdelivr.net"
      CSP_FRAME: "'self' https://docs.google.com https://www.youtube.com"
      # TODO: Reduce these limits, they are ludicrous.
      #       They only apply to the API and the admin now, and are so high because
      #       the admin has gigangitic amounts of related HTTP queries due to
      #       related objects everywhere in events.
      DJANGO_LIMIT_CONN: 20
      DJANGO_LIMIT_REQ_RATE: 20r/s
      DJANGO_LIMIT_REQ_BURST: 400
      DJANGO_LIMIT_REQ_DELAY: 200
      DJANGO_PUBLIC_LIMIT_CONN: 3
      DJANGO_PUBLIC_LIMIT_REQ_RATE: 1r/s
      DJANGO_PUBLIC_LIMIT_REQ_BURST: 3
      DJANGO_PUBLIC_LIMIT_REQ_DELAY: 3
      REACT_LIMIT_CONN: 20
      REACT_LIMIT_REQ_RATE: 10r/s
      REACT_LIMIT_REQ_BURST: 50
      REACT_LIMIT_REQ_DELAY: 30
      STATIC_LIMIT_CONN: 100
      STATIC_LIMIT_REQ_RATE: 100r/s
      STATIC_LIMIT_REQ_BURST: 500
      STATIC_LIMIT_REQ_DELAY: 100
    volumes:
      - static:/srv/static
    labels:
      # Static assets and uploaded media are public, cacheable, and have no
      # scraping value: route them straight to nginx (higher priority than the
      # Anubis router below) rather than through Anubis. Anubis is a proof-of-work
      # gate for HTML page loads and EOFs under the many parallel sub-resource
      # requests a page fires, so gating assets through it causes 502s under load.
      # HTML page loads and the API still go through Anubis (the API is low
      # concurrency and its callers carry the pass cookie, so it stays reliable).
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.$PROJECT-nginx.rule=Host(`$DOMAIN`) && (PathPrefix(`/_next/`) || PathPrefix(`/static/`) || PathPrefix(`/media/`))
      - traefik.http.routers.$PROJECT-nginx.priority=1000
      - traefik.http.services.$PROJECT-nginx.loadbalancer.server.port=80
  anubis:
    image: ghcr.io/techarohq/anubis:v1.25.0
    environment:
      TZ: $TZ
      BIND: ":8080"
      TARGET: "http://nginx:80"
      # Forward the real vhost to nginx; without it Anubis sends Host: nginx and
      # nginx's default server drops the request (444 -> proxy EOF -> 502).
      TARGET_HOST: $DOMAIN
      COOKIE_DOMAIN: $DOMAIN
      ED25519_PRIVATE_KEY_HEX_FILE: /run/secrets/.env.secrets.anubis
    secrets:
      - .env.secrets.anubis
    networks:
      traefik:
    read_only: true
    tmpfs:
      - /tmp/
    expose:
      - 8080
    healthcheck:
      test: [ "CMD", "anubis", "--healthcheck" ]
      start_period: 60s
      start_interval: 1s
      interval: 60s
      timeout: 60s
      retries: 3
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 200M
        reservations:
          memory: 64M
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.$PROJECT-anubis.rule=Host(`$DOMAIN`) || $ALTERNATE_DOMAINS_TRAEFIK
      - traefik.http.services.$PROJECT-anubis.loadbalancer.server.port=8080
    logging:
      options:
        max-file: "3"
        max-size: "10m"
  traefik:
    depends_on:
      anubis:
        condition: service_healthy


volumes:
  redis-data:
  redis-socket:
  static:


secrets:
  .env.secrets:
    file: ../.env.secrets
  .env.secrets.anubis:
    file: ../.env.secrets.anubis
